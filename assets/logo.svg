<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="kata">
  <title>kata</title>
  <!-- The form: a bounded space, opened at two corners. -->
  <path
    d="M20 6 H10 A4 4 0 0 0 6 10 V20 M44 58 H54 A4 4 0 0 0 58 54 V44"
    fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".45" />
  <!-- The routine: three strokes, each shorter, resolving to a single point. -->
  <path
    d="M18 24 H46 M18 34 H38 M18 44 H28"
    fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" />
  <circle cx="42" cy="44" r="3.5" fill="currentColor" />
</svg>
